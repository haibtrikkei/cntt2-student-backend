services:
  student-backend:
    image: haibtrikkei/cntt2-student-backend:latest
    restart: always
    ports:
      - "8081:8081"
    environment:
        SPRING_DATASOURCE_URL: jdbc:mysql://student-db:3306/student_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: 1234$
    depends_on:
      - student-db
  student-db:
    image: mysql:8.4
    container_name: student-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234$
      MYSQL_DATABASE: student_db
#    ports:
#        - "3307:3306"
    volumes:
      - student-db-data:/var/lib/mysql
volumes:
  student-db-data: